version: '3.8'

services:
  # ─── Frontend (Nginx) ────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_POCKETBASE_URL: ${VITE_POCKETBASE_URL}
        VITE_MAP_TILE_URL: ${VITE_MAP_TILE_URL}
        VITE_API_KEY: ${VITE_API_KEY}
        VITE_OSRM_URL: ${VITE_OSRM_URL}
    image: hagen-logistics-frontend:latest
    container_name: hagen-frontend
    restart: unless-stopped
    ports:
      - "80:8080"
    networks:
      - hagen-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ─── Gateway ─────────────────────────────────────
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile.prod
    image: hagen-logistics-gateway:latest
    container_name: hagen-gateway
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      GATEWAY_PORT: 4000
      POCKETBASE_URL: ${POCKETBASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      GATEWAY_CORS_ORIGINS: ${GATEWAY_CORS_ORIGINS}
      VROOM_HOST: http://vroom:3000
      OSRM_HOST: http://osrm:5000
    networks:
      - hagen-network
    depends_on:
      pocketbase:
        condition: service_healthy
      vroom:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:4000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})\""]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ─── PocketBase ──────────────────────────────────
  pocketbase:
    image: ghcr.io/muchobien/pocketbase:latest
    container_name: hagen-pocketbase
    restart: unless-stopped
    ports:
      - "8090:8090"
    volumes:
      - pocketbase-data:/pb_data
    networks:
      - hagen-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8090/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ─── OSRM ────────────────────────────────────────
  osrm:
    image: osrm/osrm-backend:latest
    container_name: hagen-osrm
    restart: unless-stopped
    command: osrm-routed --algorithm mld /data/map.osrm
    volumes:
      - ./infra/osrm/data:/data:ro
    networks:
      - hagen-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ─── VROOM ───────────────────────────────────────
  vroom:
    image: vroomvrp/vroom-docker:latest
    container_name: hagen-vroom
    restart: unless-stopped
    environment:
      VROOM_ROUTER: osrm
      VROOM_OSRM_URL: http://osrm:5000
    depends_on:
      - osrm
    networks:
      - hagen-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  hagen-network:
    driver: bridge

volumes:
  pocketbase-data:
    driver: local
