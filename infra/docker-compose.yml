services:
  # ─── OSRM Backend ────────────────────────────────────
  osrm:
    image: osrm/osrm-backend:latest
    container_name: hagen-osrm
    restart: unless-stopped
    ports:
      - "5002:5000"
    volumes:
      - osrm-data:/data
    command: osrm-routed --algorithm mld /data/brussels_capital_region-latest.osrm
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/nearest/v1/driving/4.3517,50.8503"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - hagen-network

  # ─── VROOM Optimization Engine ───────────────────────
  # NOTE: VROOM doesn't have an official Docker image on Docker Hub
  # For development, we'll run it separately or use a mock service
  # You can build VROOM from source: https://github.com/VROOM-Project/vroom
  # Or use: docker run -p 3000:3000 vroomvrp/vroom-docker locally if you have it

  # ─── PocketBase ──────────────────────────────────────
  pocketbase:
    image: ghcr.io/muchobien/pocketbase:latest
    container_name: hagen-pocketbase
    restart: unless-stopped
    ports:
      - "8091:8090"
    volumes:
      - pb-data:/pb/pb_data
      - ./pocketbase/pb_migrations:/pb/pb_migrations
      - ./pocketbase/pb_hooks:/pb/pb_hooks
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8090/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - hagen-network

  # ─── API Gateway ─────────────────────────────────────
  gateway:
    build:
      context: ../gateway
      dockerfile: Dockerfile
    container_name: hagen-gateway
    restart: unless-stopped
    ports:
      - "4002:4000"
    environment:
      - NODE_ENV=production
      - GATEWAY_PORT=4000
      - POCKETBASE_URL=http://pocketbase:8090
      - VROOM_HOST=http://localhost:3000
      - OSRM_HOST=http://osrm:5000
    env_file:
      - ../.env
    depends_on:
      - pocketbase
    networks:
      - hagen-network

volumes:
  osrm-data:
    driver: local
  pb-data:
    driver: local

networks:
  hagen-network:
    driver: bridge
